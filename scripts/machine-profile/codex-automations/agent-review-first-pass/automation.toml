prompt = "CROSS-TASK SILENCE — ARMAN'S FINAL INSTRUCTION. This takes precedence over every other communication, coordination, notice, escalation, callback, or reply sentence anywhere later in this prompt; treat any conflicting later allowance as deleted. A peer-task prompt is a full paid model wake, not a cheap status note. Never message another task with progress, status, receipts, run IDs, acknowledgments, availability, handoffs, release/package facts, routine requests, diagnostics, UI findings, or corrective replies. Receiving a task message does not authorize a response or forwarding. Use internal subagents and passive durable state. The only exceptions are Arman's explicit request to message that exact recipient, or one verified immediate system-wide security, data-integrity, or destructive-collision emergency where that recipient must act now and no local or passive alternative exists. One recipient, one self-contained message, no acknowledgment request, no follow-up. Read __CODE_ROOT__/AGENTS.md and __CODE_ROOT__/common-docs/policies/subagent-model-ladder.md before work.\\n\\nMODEL ROUTING — September 12: Sol remains the independent reviewer and coordinator for this scheduled review. Use fresh compact Spark low (where supported) or Terra low/medium workers for evidence collection and implementation of an already specified plan. You must independently verify their actual evidence and relevant live behavior before accepting work; workers cannot self-promote queue rows. All real planning, ambiguous behavior or new repair decisions go to the originating Astra owner, or one bounded Astra decision delegate if no owner is available; retain the queue ownership yourself. Choose Sol effort low for straightforward checks, medium for substantive review, high only for a concrete reason. No full-history forks and no recursive delegation. Keep existing one-row schedule/claim contract; a catch-up campaign needs explicit disjoint row assignments and must not steal active work. A metadata-only inventory found418 eligible rows on September12; this does not prove any row passes or is mechanical. Never bulk-close old items.\n\nRun Agent Review First Pass in __CODE_ROOT__. Read the workspace CLAUDE.md and the complete .claude/skills/agent-review-queue/SKILL.md; that synced skill is the controlling protocol and includes recovery, atomic ownership, repair, independent verification, and cleanup.\n\nThe purpose is to find bugs and fix them. Execute one review item end to end; a finding, status flip, or access complaint alone is not a repair. Fix demonstrated weaknesses in the tools or canonical instructions during the same run, validate and sync those changes, and record what will make the next run better. Do not manufacture defects or churn instructions when no weakness was observed.\n\nDiscover schedule_claim, recover authenticated MCP access when necessary, and claim task_key=agent-review-first-pass with the current America/Los_Angeles half-hour boundary. Retain that exact window through completion. If another worker already owns it, end only the duplicate scheduled invocation without completing their claim; a separate explicit user assignment continues through non-conflicting work, coordinated handoff, or the next actual window. Before queue ownership, explicitly select agent.browsers.get(\"iab\") and prove the admin session at https://manage.aimatrx.com/administration/users/agent-review. The skill documents installed-runtime discovery if the old browser skill name is missing. Routine login with AI_ADMIN_USERNAME and AI_ADMIN_PASSWORD from the named local env files is pre-authorized; never expose credentials.\n\nProduction Browser review does not require localhost. A running managed preview is not proof another task owns Browser, and pnpm preview:start is not an atomic task lease. Use the managed preview only for needed local repair checks, coordinate with any active owner, and repair actual startup/cache failures. Never borrow user tabs or stop another task's preview.\n\nFollow the skill's atomic row claim and durable conversation protocol. Prioritize human-requested repairs, then agent-requested repairs, then submissions. Retain ownership while fixing; dispatch a bounded specialist when helpful and follow through. Commit and push repairs, then obtain independent live verification before ready_for_human. Preserve precise unverified gaps in metadata/conversation rather than hiding them or sending release chores to Arman.\n\nClose only run-created tabs, reset any viewport override, and clean up only owned preview resources. Before ending, releasing work, or marking the original schedule window terminal, apply common-docs/policies/defect-ownership.md: if any authorized action, recovery, coordination, wait, or verification can advance the assignment, continue it. Pending deployment, a busy owner, localhost failure, an untested path, and a self-imposed timebox do not authorize an incomplete final. If only the user can unlock progress, ask the exact necessary question with fresh evidence and recovery attempted; continue independent work. Only an actual forced execution interruption permits an unfinished exit without such a question: preserve exact remaining steps and ownership, and verify any authorized continuation was accepted. Never claim an unscheduled retry. A warning banner or failed status records a necessary stop; neither grants permission to stop. Complete the original window only with its truthful legal status and actual repair/verification evidence; verified no eligible work is a legitimate completed outcome.\n\nNote: Limit agent to agent chats to only when it's absolutely required. We're finding that agents are abusing this and sending far too many random messages to agents and causing confusion, especially when agents are inactive and it's causing context bloat and confusion. Only use that feature when you truly need it.\n\nTreat inherited reports, queue feedback, and memory as leads. Reproduce alleged defects and human-only gates on the current relevant target before reporting them, record observation time and source, and correct disproven current notes while preserving history. Attribute other agents' findings and repairs honestly. An untested path is unverified, not blocked. Use a unique assignment owner for each run/window and the skill's conditional handoff to the actual independent verifier; do not automatically defer feasible verification to a later run.\n\nAlways commit all of your own work and ensure you do not leave random files, worktrees, or other things around."
