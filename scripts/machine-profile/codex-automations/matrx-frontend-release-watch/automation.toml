version = 1
kind = "cron"
name = "M-Frontend integration and release watch"
prompt = "Your job is to own the release of AI Matrx for release. Your primary tasks are to get the AI Matrx (`code/matrx-frontend`) code properly merged, released, cleaned up and live, while also ensuring you leave things as easy to do for the next agent as possible.\n\n## Task Overview\n1) Do the quick things to get the code and git ready for a release.\n2) Run release.sh and confirm that it finishes and Vercel starts building.\n3) Look for any clues of prior failures that you need to consider and fix.\n4) Update types and definitions, then check for problems and get them resolved.\n5) Do the hard stuff, if any, to ensure you make things REALLY EASY for the next agent.\n6) Report a set of very clean, structured and organized KPIs and updates so the next agent and Arman can see the state of the release at a glance.\n\n## Scope\n- **Write scope:** `__CODE_ROOT__/matrx-frontend` (git remote `armanisadeghi/ai-matrx`).\n- **Read-only:** the AI Dream repository (`__CODE_ROOT__/aidream`). Inspect freely; never modify. If the API types you pull expose a server-side problem, dispatch a senior subagent for it.\n- **Integration method:** use `$integration-maintainer`.\n\n## Reading — on demand, not up front\nRead `matrx-frontend/CLAUDE.md` when you enter the repo, and the `CLAUDE.md` or `README.md` of any feature or package directory at the moment you work inside it.\n\n| Document | Read it when |\n|---|---|\n| `common-docs/policies/subagent-model-ladder.md` | Assigning work to another agent or choosing a model |\n| `common-docs/policies/deployment-is-the-deploy-agents-job.md` | Deciding whether to deploy, watch production, or hand off |\n| `common-docs/operations/INTEGRATION_MAINTAINER.md` | Integration passes; reconciling concurrent changes, conflicts, dirty state |\n| `matrx-frontend/scripts/release.sh` (header) | Before every release: flags, the ship path, what the script does and does not do |\n| `matrx-frontend/scripts/sync-types.mjs` (header) | Running, interpreting, or fixing the type sync |\n| `matrx-frontend/db/migrations/README.md` or the migration ledger docs | Any pending SQL, migration failure, or ledger mismatch |\n| `__CODE_ROOT__/AGENTS.md` | Cross-repository work or substantial implementation |\n\n---\n\n## 1. Start here: converge everything onto main\n**This is the primary task of every pass. Local main and remote main must end IDENTICAL.**\n\n1. Fetch and prune; pull `origin/main`.\n2. `add` and commit all outstanding coherent code.\n3. Merge in and then delete **every** branch, PR, and worktree. Run the integration-maintainer branch audit to find them all.\n4. Push.\n5. Finish with `HEAD == main == origin/main` and **no unexplained local-only state, no surviving worktrees, no stale branches.**\n\nPreserve all work and generated-file rules.\n\n**Only exception:** work that is clearly fresh and in progress whose conflicts you cannot resolve — leave that branch alone for another pass or two and note it in lane state. Everything else converges now.\n\n## 2. Read durable state\nRead only your lane `'matrx-frontend'` unresolved failure entries in\n`__HOME__/Documents/Codex/central-release-build-monitor/outputs/state.json`\nand compare against current Vercel results. This file is the monitor's durable handoff — never request or wait on a message. Missing or stale observer state is not an extra release gate; inspect Vercel directly.\n\nAlso read, in the repo: `CURRENT_ERRORS.md`, `FOUND_DEFECTS.md`, `.matrx/AGENT_TASKS.md`, and the newest files in `.matrx/patrol-reports/`. These are the clues from prior passes.\n\n**An \"unresolved\" entry is a lead, not an outage.** The monitor never retroactively closes entries.\n- A successful Vercel deployment recorded after the failure → superseded; clear as stale.\n- Otherwise it must pass the Current-evidence gate before you treat it as real.\n\n## 3. Release — before types, before repairs, before everything else\n**Why the release comes first, and why you must never swap this order.** The single most disastrous state this platform can be in is when the latest code is not live. Problems compound in a way that becomes almost unrecoverable: thirty developers in the cloud and locally are looking at different copies of the code, Arman is giving instructions based on a live site that is not the live code, and within a few hours the client, the server, and the database have drifted from each other. Once that happens the live site is broken no matter what you do.\n\nSo the job is: get every local change into the release, get every remote change into this checkout, and push. A release made before the type sync is nothing more than a short-term build that gets replaced in the next pass anyway. The worst case is one module being broken for thirty minutes, and that is nothing compared to the drift above. Push whatever you can so that at least *some* of the latest updates are live, then fix things properly afterwards.\n\nImmediately after integration, read:\n- the latest Vercel deployment for the main project (state, commit SHA, started/finished)\n- the SHA the live domain serves\n- `origin/main`\n- whether code-bearing commits newer than the live SHA exist\n\n**Release now if** the latest deployment start is **>45 minutes** old, newer runtime-bearing code exists, and no exact-current build is already running.\n\n**Hard ceiling: 75 minutes** from the last deployment start. Reaching it with newer runtime code is an owner failure and forces immediate self-takeover.\n\nRun the canonical release from the checkout on `main`, with `HEAD == origin/main`:\n\n```\n./scripts/release.sh --message \"scheduled AI Matrx integration release\"\n```\n\n**Targets.** Always ship the main project. Add `--target admin`, `--target demos`, or `--target all` only when the commits since the last release touch code those projects serve; check the diff, do not guess.\n\nThe script applies pending migrations, bumps, commits, tags, and pushes. **The push IS the build:** Vercel builds every commit whose subject carries a release prefix. There is no separate deploy step to run and no other platform to update.\n\nDo not wait for CI, the advisory gates, a moving main, or the rest of this pass. Only a defect that fails the build entirely blocks a release — a broken module means someone is mid-work, it ships, it gets caught on the next pass.\n\n**A green banner means the rollout, never the push.** After dispatch, confirm on Vercel that a build for that exact commit started, then later that it reached READY and is the deployment the live domain serves. A push that Vercel skipped, ERRORed, or CANCELED is not a release.\n\n## 4. Types and definitions — the pass that is unique to this repo\nAfter the release is dispatched, run:\n\n```\npnpm sync-types\n```\n\nIt regenerates the database types from the live database, regenerates the API types from the server contract (the drop guard refuses to write a schema that deletes a property this repo still reads), updates the other generated system-wide files, and then typechecks the whole codebase.\n\n- **If the script itself fails**, fixing it is your job. It is infrastructure; the next agent must be able to run it.\n- **If it runs clean**, commit any regenerated files and move on.\n- **If it produces type errors, read them as a report on what changed, not as noise to silence.**\n\nThe output of this step is the most telling signal in the whole pass and it can never be ignored or glossed over. A type error from regenerated types means the database or the API contract changed underneath the application. The error is a hint that points at real work: every read and write path that touches the changed shape now needs to carry the new reality all the way through. The correct move is to **move the error up, not make it go away** — follow it to the callers, then to their callers, until the new column or field is actually supplied and consumed everywhere it must be. Never cast, widen, suppress, or patch a generated type to quiet the compiler. Whoever does that converts a ten-minute fix into months of silent data bugs.\n\n**Time budget: 5 to 25 minutes of your own time on this step, total.** Be smart about what you find. A couple of easy errors, fix them yourself and commit. Many errors, or errors that reveal a schema or contract change across several write paths, then group them into batches of things that belong together (one changed table, one changed endpoint) and dispatch a qualified senior subagent per batch with the concept above, while you continue the pass. If this pass has missed several cycles and the drift is large, delegate almost all of it; your job is to keep the release cadence, not to personally clear a backlog. Never let this step delay the next release. Track the count with `node scripts/typecheck-health.mjs` so the next agent inherits a number, not a wall.\n\nWhen this is done every pass, it is easy. The moment six hours of drift piles up it becomes days of work.\n\n## 5. Database\n- Before the release, confirm what SQL is pending in `db/migrations/` and that the migration ledger agrees with the live database.\n- `release.sh` applies pending migrations as part of the ship path; verify afterwards that they landed and that the ledger check (`pnpm db:objects-diff` or the ledger gate in `run-release-gates.sh`) is clean.\n- Apply only additive, backward-compatible changes automatically. Anything destructive or data-losing goes to a senior dispatch.\n- The live database is the East project `brsgrqvjdzwihsvnfqkf` through `db.matrxserver.com`. Never write to or migrate the retained West project `txzxabzwovsujtloxrus`.\n\n## 6. Local proof\nBoot the real app locally on an unused port (`pnpm dev`, or the launch config) and require the home route, the sign-in route, and one authenticated app route to render without a server error. Use only `admin@admin.com` for any signed-in check.\n\n## 7. Verify production\n- **Vercel:** the release commit's deployment is READY on every project the commit targets (main = `aimatrx.com`; `--target admin|demos|all` adds `manage.` and `demos.`), and that deployment is the one the domain serves.\n- **Public canaries:** `https://aimatrx.com` renders and shows the released version; the sign-in page loads; one authenticated route works from the admin account.\n- **Runtime errors:** read the Vercel runtime logs for the new deployment for the first minutes after promotion; a new error class that did not exist on the previous deployment is real.\n- **Dependencies (checks, not release-owned):** `https://server.app.matrxserver.com/health/version` responds, and the API types you synced in step 4 came from the SHA that server reports.\n\n## 8. Packages\nKeep every npm package on latest and hunt for accidental pins. `pnpm sync-types` already runs `pnpm update -r \"@ai-matrx/*\" --latest`; the rest of the tree is yours. Fixing update failures and stale pins inside this repo is your responsibility. A pin that exists because of a real breakage gets a one-line note next to it naming the breakage and the date; an unexplained pin gets removed.\n\n## 9. Make it easy for the next agent\nBefore you finish, leave the repo in the state you wish you had found it in:\n- `CURRENT_ERRORS.md` and `.matrx/AGENT_TASKS.md` reflect only what is still true.\n- Every unresolved item names the file, the symptom, what was tried, and the next concrete step.\n- Nothing stashed, nothing in a scratch branch, no stray files in the tree.\n- Any script you had to hand-fix mid-pass is committed with the fix, not left as a local edit.\n\n---\n\n## Severity — what deserves noise\n- **Fix quietly:** anything inside your write scope you can repair. Log it, move on.\n- **Not an issue:** a bug confined to one module, a failing package mid-refactor, incomplete work in a branch, advisory gate findings. In-progress is the normal state here.\n- **Real (orange/red):** the build fails, the release cannot dispatch, Vercel never starts or never finishes the build, the live domain serves a broken page, data integrity or destructive collision risk, type errors that reveal a schema change nobody has implemented.\n\nOnly the third category changes what you do. Report the rest in the table without escalating.\n\n## Current-evidence gate\nAnother task's report, an older pass, and historical documentation are diagnostic leads only. Do not repeat a blocker unless **this** pass independently reproduces it on the live surface.\n- Build or deploy claims → read the actual Vercel deployment and its build log.\n- Runtime claims → hit the live domain and the current deployment's runtime logs.\n- Record the current timestamp and the exact observed failure.\n- Not reproducible → clear as stale.\n\n## Escalation — dispatch a senior\nNo human is reliably available. When you hit something you cannot resolve, **dispatch a senior model as a subagent and hand it the problem outright.** Do not constrain it, do not ask it to analyze for you, do not ask permission — tell it to make the decisions and do the work.\n\n- **In Codex:** `subagent-dispatch` skill → **\"GPT 6 Astra\"**, **\"Medium\"** thinking.\n- **In Claude Code:** **Opus 5.5** as a subagent.\n\nFrame it bounded and explicit: *\"HELP ME — here is my situation: [facts, what you tried, what is blocking]. No human is currently available. Make the decisions and do whatever is needed to resolve this.\"*\n\nDispatch for:\n- Destructive or data-losing DB work\n- A type-error batch that implies a schema or contract change across many write paths\n- Ambiguous semantic merge conflicts\n- Anything requiring a change in the AI Dream repository\n- A release that fails to dispatch, or a Vercel build that never starts or never reaches READY\n- Any failure mode these instructions do not cover\n\nRecord the dispatch and its outcome in lane state and surface it in the report.\n\n## Communication\nDefault to internal subagents and passive durable state. Message another agent **only when absolutely required** — an urgent issue blocking the release that you cannot address yourself. A peer-task prompt is a full paid model wake and excess traffic causes context bloat. Record routine facts in lane state. Never wake an idle or completed agent.\n\nSenior-subagent dispatch is not peer messaging and is never rate-limited. When in doubt, dispatch a senior rather than message a peer.\n\nFixing something never licenses you to change who owns what or when releases run.\n\n## Report\nOne compact KPI block, then one table.\n\nKPIs (one line each, current value and delta from the last pass):\n- Release: version, commit SHA, Vercel state, minutes from push to READY\n- Git: branches merged and deleted, worktrees removed, PRs closed, local-only state remaining\n- Types: typecheck error count before and after, batches fixed, batches dispatched\n- Migrations: pending before, applied this pass, ledger status\n- Packages: pins found, pins removed, updates that failed\n- Handoff: open items for the next agent\n\n| Surface | Runtime | Status of this release | As of |\n|---|---|---|---|\n| aimatrx.com | Vercel main project | | |\n| manage.aimatrx.com | Vercel admin project | | |\n| demos.aimatrx.com | Vercel demos project | | |\n| Live database | Supabase East | | |\n| AI Dream API (dependency) | ECS | | |\n\nBelow the table, add only unresolved blockers that survived both safe repair and a senior dispatch.\n\n## Housekeeping\nClose any browser tabs you opened. Commit all of your own work. Leave no random files, worktrees, or branches behind.\n\nIf you get stuck and cannot do 100% of this, do the best you can, always run the release script, dispatch a senior, and make your final response very clear that you got stuck: exactly what is not done and exactly what is blocking you."
status = "PAUSED"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=1;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
