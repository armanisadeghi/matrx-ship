name = "AI Dream maintenance and prevention"
prompt = "You own the SLOW AI Dream maintenance and prevention lane. This is separate from the fast Git/release relay. Do not dispatch ./scripts/release.sh, duplicate an active release, or wait for an app build. The fast lane owns Git convergence, app release dispatch, and the PREVIOUS release verdict. Your job is to remove latent causes of the next failed release and to run the deeper checks that do not belong on the healthy release critical path.\n\nScope and safety\n- Write only __CODE_ROOT__/aidream and AI-Matrix-Engine/aidream-current. AI Matrx (Matrx Frontend), common-docs, and provider topology outside approved repair scope are read-only; give a senior delegate an exact issue when a change there is required, without silently expanding authority. Read each repo/package AGENTS.md or CLAUDE.md when entering it, plus __CODE_ROOT__/AGENTS.md for cross-repo work. Read common-docs/policies/subagent-model-ladder.md before dispatch. Read the relevant platform checklist, sandbox REGISTER, infrastructure FEATURE, and aidream/scripts/FEATURE.md when doing those checks.\n- Preserve dirty in-progress work, other owners' branches, generated-file rules, and local repair receipts. Work directly on shared main with exact path attribution; do not create local branches or worktrees. Do not alter the fast lane's release ownership, schedule, or check set. Avoid concurrent migration/package publication with release.sh; use its existing lock/receipt mechanism and provider state. Never touch the retained West Supabase project txzxabzwovsujtloxrus; live DB must be East brsgrqvjdzwihsvnfqkf through db.matrxserver.com.\n- Transition guard: before any write, inspect Codex tasks for an ACTIVE pre-split task titled `AI Dream integration and release watch`. The paused baseline may still have a run that started before this split and does not honor the new claim. While it is active, work read-only and defer DB/Git/package/provider writes; record the deferral. Resume normal maintenance on a later run when no pre-split task is active.\n- Shared mutation claim across all three lanes: complete task/task-lock inspection and every read-only preflight—including diagnostics and local boot—without a claim. Claim only immediately before one specific attributable Git, DB, package, or provider mutation: resolve the ONE absolute path with `git -C __CODE_ROOT__/aidream rev-parse --path-format=absolute --git-path ai-dream-lane-mutation.lock`, then atomically mkdir it. Fast active work has priority: before claiming and immediately before the mutation, reconfirm that no fast owner is active or due to mutate; if it is, remain read-only and defer. Record hostname, shell PID, CODEX_THREAD_ID, automation ID, unique run ID, UTC start and heartbeat in an owner file; refresh the heartbeat at least every 5 minutes during that mutation. The thread ID, not the short-lived shell PID alone, identifies the owner. A claim is live when its exact task is active and heartbeat is <15 minutes old; if task status is unavailable, treat it as uncertain. Reclaim only if heartbeat is >15 minutes old, the recorded PID is absent, AND the exact owner task is confirmed stopped/failed/idle; atomically move the old claim to a uniquely named quarantine path before trying mkdir again and record that recovery. Never steal a live/uncertain claim: stay read-only and defer writes. Release the matching claim immediately after the mutation; never retain it during local boot, diagnostics, other read-only checks, or waiting. On normal exit/signals remove only a claim whose run ID still matches yours. Fast and audit helpers honor this same claim.\n- Read the aidream lane's unresolved monitor entries in __HOME__/Documents/Codex/central-release-build-monitor/state.json only as leads. Reproduce against the current provider and consumer before reporting; clear superseded history as stale.\n\nWork, in this order:\n1. Read __HOME__/.codex/automations/ai-dream-fast-integration-and-release-relay/memory.md (create only your own receipt file, not this one) and current provider state; prior receipts are leads, not proof. If a previous release or live consumer is RED, prioritize concrete root-cause repair immediately; assign bounded internal subagents where useful, use GPT-6 Sol for RED diagnosis/management and one batched independent Sol review of each material repair under the model ladder, and continue until repaired or an exact external gate is proven. Record durable facts for the fast lane's next natural read.\n2. Reconcile East database migrations with db/detect_applied.py and db/apply_migrations.py. Apply only additive backward-compatible changes automatically; destructive or data-losing operations require senior escalation. Regenerate with db/generate.py; compare output carefully and preserve hand-maintained/generated-file rules. Update API/types and affected callers inside write scope; inspect frontend type/package impact read-only and dispatch a senior for any necessary frontend change.\n3. Boot the real app locally on an unused port and require /health/ready, /health/version, and /health/detailed with role=app_server. Run focused tests and repair actual code, type, import, migration, or configuration failures. Commit and push stable attributable repairs; do not include others' work or leave disposable resources.\n4. Audit npm and Python package update failures and accidental old pins within AI Dream; repair safe in-scope issues. Inspect AI Matrx read-only and hand any required changes to a senior. Reconcile previous release.sh detached package-publish receipts and repair publisher failures. Keep package publishing independent of app release timing.\n5. Run the deeper production/dependency checklist: ECS/EC2, residual and development Coolify, Vercel, Supabase East, Ship host, DNS and Manager inventory; both sandbox orchestrators, live ECS tier credentials, private EC2-to-AI-Dream route, per-tier binding/command/real token-expiration-remint canaries, browser HTTPS/WSS and persistence acceptance, authenticated stream path, Matrx Files and SEO endpoints. Use the canonical inventory and sandbox REGISTER; an HTTP /health alone never proves an unresolved consumer case. A missing runtime, new unlisted always-on runtime, or owner/route mismatch is an incident. Do not replace historical West migration evidence.\n6. Repair findings inside scope, verify the specific behavior, commit/push. For out-of-scope documentation or platform changes, dispatch a bounded senior only when the task authority allows it and record the exact handoff. Do not turn a latent concern into a production blocker without current consumer evidence. Close any browser tabs you opened.\n\nAppend a compact per-run receipt to __HOME__/.codex/automations/ai-dream-maintenance-and-prevention/memory.md (create if absent): UTC start/end, run ID, lease outcome, East migration/generation/type/package/local-proof/inventory/sandbox/dependency results, exact repairs/commit IDs and remaining gates. The fast and eight-hour audit lanes read it without a peer wake.\n\nNormal output: a concise checklist of completed maintenance, fixes/commit IDs, tests and provider evidence, plus unresolved exact gates. Do not fill the fast lane with routine status. RED output: full root cause, delegated repair outcomes, verification, and remaining live risk. Never say a release succeeded because it was dispatched; the fast lane judges the previous release."
status = "PAUSED"
rrule = "RRULE:FREQ=MINUTELY;INTERVAL=90"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
notification_policy = "failed_runs_only"
execution_environment = "local"
cwds = ["~"]
