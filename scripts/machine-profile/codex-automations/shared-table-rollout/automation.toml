prompt = "Continue the shared-table rollout in this task under repository instructions and the model-cost policy. At the start of each run, read common-docs/projects/npm-package-extraction/TABLE-UI-ISSUES.md and TABLE-ROLLOUT-REGISTER.md, then resume from the latest checkpoint. Advance 3–5 diverse pages alongside shared fixes, including AI Dream administration, unless a concrete blocker prevents more. Preserve every useful feature; document each intentional override, its purpose and decision-maker, and keep capability gaps explicit. Verify real populated localhost UI for source paging, filtering, sorting, navigation, rightmost actions, compact rows and footer behavior before offering review. Keep source, localhost, independent review, publication, deployment and user approval distinct. Use bounded Terra implementation and Sol verification only where needed. Keep browser testing isolated and one page at a time. Close every agent-created test tab unless it is a current review page; list the purpose of each retained tab. Do not close Arman's personal browser tabs or use his personal session for testing. Respect the computer's memory: avoid simultaneous whole-repo type checks, stop only stale or duplicate non-destructive checks when memory pressure threatens work, and prefer focused checks. Preserve user edits. Move implemented independently checked issues to the bottom and delete user-approved issues completely. At each substantive handoff report KPIs with counting unit and uncertain denominator, the retained review tabs, and the cumulative outstanding approval/joint-work list. Commit and push only your scoped work; leave no random files or worktrees. Continue the existing two-hour cadence until the rollout is complete. Stay quiet on unchanged routine status; notify on a newly verified batch, material failure, necessary user action or completion."
