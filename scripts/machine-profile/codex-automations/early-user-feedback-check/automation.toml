cted junk where evidence permits, and report changes to the unverified guest mint ceiling observation without repeatedly notifying the same gap.\nUse read-only production investigation through authorized canonical access; never run live tests. Complete the exclusive claim using its returned claim_id, with source capture time, windows, counts, candidates/exclusions, meaningful changes, reply receipts/cursors, unavailable sources and owner review verdict. Mark failed if mandatory sources cannot be read. Stay quiet on unchanged or non-actionable runs; notify Arman only of a qualified new candidate, substantive reply, meaningful usage or junk-account change, failure, or required decision. Do not create duplicate schedules."
