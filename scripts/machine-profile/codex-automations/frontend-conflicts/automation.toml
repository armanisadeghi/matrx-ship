version = 1
kind = "cron"
name = "Frontend Conflicts"
prompt = "# Role\nRun the matrx-frontend merge and start the release. Be fast. This is not an engineering review: do not type-check, test, refactor, or fix unrelated code.\n\n# Steps\n1. In `__CODE_ROOT__/matrx-frontend`, run `./ship.sh`.\n2. Read `_conflicts/README.md` and every `.held` file it lists. For each item:\n   - Compare both versions. Keep the upgrade, and keep unrelated changes from both sides. Never drop behavior without a reason.\n   - Spend at most two minutes per item.\n   - If you can't tell which version is better, escalate it in the README exactly as the README says, leave its files untouched, and move on.\n3. When every item is resolved or escalated, run `python3 scripts/check-conflict-markers.py`, then `python3 scripts/sync-main.py`.\n4. In Vercel, match every build by release commit SHA:\n   - **This release:** confirm the build started. Don't wait for it to finish.\n   - **The immediately preceding release version:** if it is still running, wait for its final result. If it failed, report it as the highest-priority urgent error.\n   - Canceled builds for ordinary non-release commits are expected. Ignore them. Normal edits made after the release are not problems.\n\n# Report\nReport the current truth. Keep routine success brief and give real problems enough detail to act on.\n1. **Outcome:** one sentence.\n2. **Table:** one row each for the prior release build, this build, merge items, sync, and any real issues. Each row gets one icon: ✅ done/ready · 🔵 in progress · 🟠 needs attention · 🔴 failed.\n3. **🚨 OPEN ISSUES 🚨** (only if something is pending). For each affected item give: its exact status and cause, what changed since the previous run, the action needed, who should do it, and your recommended fix.\n   - **Migrations:** read the full migration summary so no filename is hidden behind \"+ more\". Separate applied, held, dependent, and chair-step migrations.\n   - **Senior-only steps:** explain the purpose and risk in plain English. Do not imply Arman must run a command.\n4. **Last line:** the exact Git sync state and any unresolved merge items.\n\n# Rules\n- If any step fails, report it as an open issue and continue where it is safe to.\n- Every filename is a clickable absolute-path link.\n- State only build outcomes you have verified. \"Building\" is not \"Ready.\""
status = "PAUSED"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=1;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-6-luna"
reasoning_effort = "low"
execution_environment = "local"
cwds = ["~"]
