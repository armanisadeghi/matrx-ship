version = 1
kind = "heartbeat"
name = "AI Dream split audit and repair check-in"
prompt = "Every eight hours, audit the AI Dream lane split that replaced \"AI Dream integration and release watch\". This is a hands-on repair and accountability check, not a passive reminder.\n\nTRANSITION SAFETY: the paused baseline may have a pre-split run already active under the title `AI Dream integration and release watch`. Check for it before assigning any mutating helper; while active, diagnosis may proceed but no new helper may write or dispatch because the old run does not honor the new claim.\n\nFIRST PRIORITY: look for anything less than perfect in the latest fast-relay and maintenance runs, GitHub deploy.yml and package workflows, exact live release, all release-owned ECS/Coolify services and required consumer checks, Git convergence, migration/type/package receipts, task overlaps, missed schedules, stale/unresolved monitor leads, and avoidable waiting. Read the fast and maintenance per-run receipts at __HOME__/.codex/automations/ai-dream-fast-integration-and-release-relay/memory.md and __HOME__/.codex/automations/ai-dream-maintenance-and-prevention/memory.md (either may be absent before its first run). Compare each claim with current provider evidence and timestamp it. For each concrete defect, promptly assign bounded internal subagents under __CODE_ROOT__/common-docs/policies/subagent-model-ladder.md, or a senior GPT-6 Sol for hard causality/independent verification; give them the evidence, write scope, and acceptance test. Coordinate authorized in-scope fixes through bounded subagents; do not independently mutate while either lane is active. Every mutating helper must honor the ONE shared claim at `git -C __CODE_ROOT__/aidream rev-parse --path-format=absolute --git-path ai-dream-lane-mutation.lock`: atomic mkdir; owner file with hostname, shell PID, CODEX_THREAD_ID, automation ID, unique run ID, UTC start and heartbeat refreshed at least every 5 minutes; remove only its own matching claim on exit/signals. The task ID, not short-lived shell PID alone, identifies the owner. Live means exact owner task active and heartbeat <15 minutes old. Reclaim only when heartbeat >15 minutes old, PID absent, and exact owner task confirmed stopped/failed/idle, by atomically moving old claim to a unique quarantine path before trying mkdir; log recovery. If owner status is unavailable, claim is uncertain: do not steal it. Every helper works directly on __CODE_ROOT__/aidream shared main; never create a local branch or worktree, and leave none behind. Verify and commit/push only attributable work. Use the canonical release owner for deployment. Do not stop at saying something is wrong. Do not alter the paused baseline prompt. If a decision requires new authority, report the exact gate.\n\nReview the actual automation configs and recent runs each time: the baseline should remain PAUSED and unchanged except its name/status; exactly one active fast release owner should exist; the maintenance lane should not block or duplicate release dispatch. Check whether the fast lane judged the previous release rather than waiting for its own; whether GREEN runs finished near the 8–12 minute target; whether RED issues got root-cause repair and help; and whether the maintenance lane completed DB, generation/types, packages, local proof, inventory, sandbox, and dependency work without colliding with releases. Measure agent duration, dispatch latency, CI queue/build/rollout durations, avoidable waits, and work actually completed.\n\nReturn a FULL report on every check-in, including: exact as-of time and period reviewed; a done/not-done matrix for every obligation; previous-release and current-live verdict with direct evidence; each imperfection, root cause, subagent assigned, repair and verification (or exact remaining gate); fast and maintenance run durations; GitHub queue/build/rollout and frontend comparison where useful; whether the split improved efficiency; and the next smallest adjustment. Lead with what you fixed, not a warning-only list. If everything is genuinely good, say so explicitly and still provide the full measured report."
status = "PAUSED"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=8"
