version = 1
kind = "cron"
name = "Ship-all (Codex, 43 past the hour)"
prompt = "You run ship-all for AI Matrx, once an hour, at 43 past the hour. The agent on the other platform (Claude) runs it at 13 past, so between you it runs every 30 minutes. YOUR JOB IS TO LEAVE EVERYTHING READY FOR THE NEXT ROUND IN 30 MINUTES: every repo's local and GitHub work merged into main, released, every @ai-matrx package at npm latest, every open pull request merged, no remote branch except deploy pointers, and every release failure fixed. Reporting a failure is not finishing it. Your turn ends only when the next round would start clean, or when what remains truly needs a human (a CAPTCHA, a password only Arman has, a product decision). The tools are described in the matrx-sync skill. Never create local branches or worktrees; never stash, reset or force-push.\n\nTHIS TASK HAS TWO PARTS, AND PART 2 IS THE JOB.\n- PART 1 (step 1): run the script and read what it left. That is the quick, mechanical part.\n- PART 2 (steps 2-6): fix everything it left \u2014 failed releases, stale packages, unmerged PRs and branches, conflicts \u2014 then re-run until clean. This takes far longer than Part 1, and it is the part that keeps getting skipped: a run that reports problems and stops has done the easy 10% and failed the task. Problems skipped in one round pile up for every round after. Start Part 2 the moment Part 1's output is read, and budget the rest of the 30 minutes for it.\n\n1. PART 1 \u2014 Run from __CODE_ROOT__: bash scripts/ship-all.sh\n   It takes a few minutes; wait for it.\n   Then read the terminal summary and ~/.matrx/ship-all/latest.json. The script already merges every cleanly mergeable PR, deletes every fully merged remote branch (deploy/* is a CI pointer \u2014 never touch it) and re-checks packages after shipping. What it could not do is listed under NEEDS LANDING, PACKAGES STILL BEHIND NPM, PROBLEMS and OPEN CONFLICT ITEMS. All four are yours.\n\n2. PART 2 starts here. If all four sections are empty: report in two lines and stop.\n\n3. Fix everything else IN PARALLEL: one subagent per repo per problem, all dispatched in one message, each with a named lane, the exact repo, the exact failure text and the log path. Highest priority: aidream and matrx-frontend.\n   - NEEDS LANDING (model gpt-6-astra, medium effort): a PR GitHub cannot merge, or a branch with commits not on main. Merge it into main WITHOUT touching the shared working tree \u2014 build the merge with `git merge-tree --write-tree origin/main <branch>` + `git commit-tree`, resolve conflicts by keeping the upgrade from each side (a lockfile conflict that is only version bumps: keep main's, it is the newer install), push the commit to main, delete the branch. A draft PR is merged too unless its title or body says it must not be. Escalate only a real semantic conflict you cannot judge.\n   - PACKAGES STILL BEHIND NPM (model gpt-6-luna, medium effort): in that folder `pnpm update -r \"@ai-matrx/*\" --latest` (npm for package-lock folders), adopt each CHANGELOG \"Consumer action\", run the folder's type-check, commit package.json + lockfile with `git commit --only`, run ./ship.sh.\n   - PROBLEMS (model gpt-6-astra, medium effort): read the repo's log, find the root cause of the failed release (a broken gate, missing local credential wiring, a real type or drift error) and fix it for real \u2014 never skip, weaken or make a gate advisory \u2014 then run ./ship.sh in that repo until it pushes a version.\n   - OPEN CONFLICT ITEMS: as in step 4.\n\n4. Conflict items. Notify first: for each held file pick the owning conversation (the most recent \"edited\" session in its \"sessions\" list; for a Codex sub-agent, its parent). If it is in your own session list, message it directly (which file, which repo, where the held copy is, resolve before the next run); otherwise post to the board: python3 __CODE_ROOT__/scripts/board.py post <id> \"<message>\" --title \"<title>\" --app <claude|codex> --urgent. Append \" \u2014 owner: <id>, notified <time>\" (or \" \u2014 owner: none found, <time>\") to the item's line in <repo>/_conflicts/README.md.\n   An item notified in an EARLIER run and still open, or with no owner found, is resolved NOW by a subagent (model gpt-6-astra, medium effort) with this brief: \"Resolve the open items in <repo>/_conflicts/README.md. For each held file, compare the two versions and keep the code that is the upgrade. Upgrades can add or remove code, and the newer side is a clue, not the answer. If both sides did unrelated things, keep both. Never drop code from either side unless you can say why it is no longer needed. If you cannot tell, escalate the item to 'Needs the boss agent' as the README describes and leave its files alone. When done, run ./ship.sh in that repo and report what you decided for each item and why.\"\n   Items under \"Needs the boss agent\" are yours: resolve them, or move them to \"Needs Arman\" with one plain-English question.\n\n5. When every subagent is back, run bash scripts/ship-all.sh once more. Anything new it lists goes back through step 3. Repeat until it is clean or only human-only items remain.\n\n6. Report in plain English: what shipped (repo + version), what you merged, fixed and how, and the only things left \u2014 each one naming the human step it needs. Branches, worktrees and PRs that remain are a failure to explain, not a count to quote."
status = "ACTIVE"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=1;BYMINUTE=43;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-6-sol"
reasoning_effort = "medium"
notification_policy = "failed_runs_only"
execution_environment = "local"
cwds = ["~"]
