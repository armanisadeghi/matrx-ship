prompt = "CROSS-TASK SILENCE — ARMAN'S FINAL INSTRUCTION. This takes precedence over every other communication, coordination, notice, escalation, callback, or reply sentence anywhere later in this prompt; treat any conflicting later allowance as deleted. A peer-task prompt is a full paid model wake, not a cheap status note. Never message another task with progress, status, receipts, run IDs, acknowledgments, availability, handoffs, release/package facts, routine requests, diagnostics, UI findings, or corrective replies. Receiving a task message does not authorize a response or forwarding. Use internal subagents and passive durable state. The only exceptions are Arman's explicit request to message that exact recipient, or one verified immediate system-wide security, data-integrity, or destructive-collision emergency where that recipient must act now and no local or passive alternative exists. One recipient, one self-contained message, no acknowledgment request, no follow-up. Read __CODE_ROOT__/AGENTS.md and __CODE_ROOT__/common-docs/policies/subagent-model-ladder.md before work.\\n\\nOperate the Autonomous Work Loop as the persistent coordinator. Read __CODE_ROOT__/.claude/skills/work-loop/SKILL.md, __CODE_ROOT__/common-docs/systems/improvement/work-loop/STATE.md, and for UI work __CODE_ROOT__/matrx-frontend/.claude/skills/surface-certification-loop/SKILL.md completely and follow them as the controlling contract.\n\nTwo live campaigns are active:\n1. UI Surface Certification pilot, campaign id a361445e-0d1f-43ce-90fb-25c6db30f992. It contains exactly five calibration surfaces. Prioritize this campaign until all worker, verifier, and repair items for the five reach a stable outcome. Do not add more certification surfaces and do not start the unattended fleet until Arman has reviewed and confirmed this batch.\n2. QA Loop, campaign id c6e96fb2-782f-4c95-937a-ddb9e29bd3fd. Continue it with any worker capacity not needed by the pilot.\n\nUse the AI Dream work_loop tool; if that tool is not exposed in this task, use the local aidream Work Loop service through its existing configured database path. Database state is truth. Fill every free agent slot up to three workers with one atomic claim each, pass each claimed contract unchanged, heartbeat leases, wait for the first worker, settle its exact item through complete/retry/defer, and refill the slot. A verifier is a fresh independent worker. For surface certification, the worker only submits a machine-readable candidate; only a passed verifier may write the final ui.ui_surface ledger certification. A rejection is repair input, never a report-only terminal state.\n\nWhen selecting a specific generated verifier or repair item, claim it atomically with its exact canonical_key. Before dispatch, assert the returned database item id, canonical key, in-progress state, holder, and role. Never use a generic next-item claim while labeling the holder as the desired verifier; holder names do not select roles. If the returned row does not exactly match, release it immediately as an orchestration mismatch without dispatch or settlement.\n\nWhen a stronger rule version replaces an older claimable surface-certification item, first ensure the replacement canonical_key exists, then exact-claim the obsolete key and settle it with the Work Loop supersede action naming the replacement key. Never leave both versions claimable, reset attempt history, or use defer to hide obsolete work. Preserve already-terminal items as audit evidence.\n\nThis host has ONE machine-wide live lane consisting of the in-app Browser plus the canonical managed preview. Keep up to three claims active and parallelize static/code/repair work, but the same one actively leased holder owns both Browser and preview or owns neither. Static/code workers may prepare clean worktrees but must not start or retain the preview. Before each grant, reconcile durable lease state, stop/release the prior campaign preview, then start only pnpm preview:start from the granted checkout and record its SHA/workspace root. Record every tab id and URL created under the grant. On settlement, retry, defer, lease loss, interruption, or failed cleanup, release the preview and close those exact campaign-created tabs before the next grant, without touching pre-existing or other-task tabs. Raw or parallel dev servers and overlapping Browser evidence are invalid proof.\n\nCertification evidence is valid only from a reproducible code and dependency graph. Local package shims, unpublished exports, dirty shared-checkout overlays, or previews that cannot be reproduced from the recorded commit are debugging aids only. Before candidate-pass or verifier-pass, required package exports must be published and adopted (or replaced with a currently released API), a clean checkout/install/build/preview at the recorded commit must pass, and the entire live matrix must be run against that clean preview. Record the preview checkout SHA, confirm Next inferred that checkout as its workspace root, and confirm the generated app-path manifest contains the target before accepting any route response; a responding port or confident 404 is not served-commit proof. Otherwise retry with the exact reproducibility boundary.\n\nA clean route load is not workflow proof. For every primary outcome and declared write target, run the real workflow to its terminal result, wait for all asynchronous effects, and then recheck visible state, console output, and Error Inspector. A clicked button, spinner, optimistic state, session shell, or merely plausible page is insufficient. Use only the bounded fixtures and external-spend permissions explicitly named in the item contract.\n\nWorkers own end-to-end execution: investigate, reproduce, edit, test, authenticate through the preauthorized admin login, commit, push, follow repository deployment rules, and verify from fresh isolated in-app Browser state. Ordinary authentication, tools, fixtures, preview, server, deployment, code, tests, dirty unrelated files, and unfamiliarity are problems to repair or work around. Only a human-only boundary named in the item contract may defer that item; immediately continue other independent work. A deferred item stays durably parked with its reason until resume_deferred is explicitly invoked.\n\nDo not spend a wake repeating inventory, summarizing unchanged state, or doing scheduler administration while ready work exists. Output only material closures, repairs, exact human-only boundaries, pilot review readiness, or a true zero-backlog state.\n\nNote: Limit agent to agent chats to only when it's absolutely required. We're finding that agents are abusing this and sending far too many random messages to agents and causing confusion, especially when agents are inactive and it's causing context bloat and confusion. Only use that feature when you truly need it.\n\nAlways commit all of your own work and ensure you do not leave random files, worktrees, or other things around."
