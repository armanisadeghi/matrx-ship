version = 1
kind = "cron"
name = "M-Local release watch"
prompt = "Inspect only __CODE_ROOT__/matrx-local and GitHub repository armanisadeghi/matrx-local. Follow the repository's current AGENTS.md and CLAUDE.md and preserve all concurrent user work. Fetch and prune origin; inspect working-tree cleanliness, local/main divergence, open pull requests, new origin branches, CI status, the latest release, and unresolved local-lane failures recorded in __HOME__/Documents/Codex/central-release-build-monitor/state.json. Verify release freshness by comparing the latest published tag with origin/main by file, not merely by CI status. Treat changes under app/, desktop/src/, desktop/src-tauri/, pyproject.toml, desktop/package.json, or runtime/build manifests as runtime-bearing. A published release more than 59 minutes old while newer committed runtime-bearing origin/main work exists is an owner failure requiring immediate recovery. If the primary checkout is dirty with unrelated active work, release the committed origin/main cutoff from an isolated temporary clone outside __CODE_ROOT__, then remove that clone after proving it has no unique work; never let unrelated dirty work postpone the committed release.\n\nWhen completed compatible runtime-bearing work is ready and existing authorization permits release, take ownership end to end: reconcile conflicts safely, run proportionate tests, run pnpm sync:matrx-packages in desktop/, adopt required package CHANGELOG consumer actions, commit and push only the intended changes, and release with ./scripts/release.sh. Verify every release job and every published asset. On this Apple Silicon Mac, download the correct published DMG, verify its published checksum, code signature, notarization, and stapling, install it to /Applications/AI Matrx.app using a recoverable rollback for the prior app, launch it, and verify the visible installed version plus actual ready state (the app reaches its usable UI, the engine connects, and the login/authentication path has no blocking error). A published tag, green CI, downloaded artifact, or launched process alone is not completion.\n\nNotify Arman only when a meaningful change occurs: a verified release has been installed and is ready for him to test, a release or installation fails after bounded recovery, a suspicious change is found, or user action is genuinely required. Stay quiet when nothing actionable changed or work is merely queued/in progress. A readiness notification must state the installed version, exact release/source cutoff, and live verification performed. Do not send routine messages to other tasks unless Arman explicitly asks for that exact recipient or there is a verified immediate system-wide emergency requiring action.\n\nDelete only branches proven merged and not explicitly reserved for salvage/review. Never inspect, modify, merge, push, release, or manage automations for any other repository. If browser tabs are opened, close only the tabs created by this task before finishing.\n\nAlways commit all of your own work and ensure you do not leave random files, worktrees, or other things around."
status = "PAUSED"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=1;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-6-luna"
reasoning_effort = "low"
execution_environment = "local"
cwds = ["~"]
