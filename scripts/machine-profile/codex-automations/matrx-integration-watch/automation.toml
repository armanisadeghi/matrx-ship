name = "Common Docs and remaining repos watch"
prompt = "FIRST ACTION ON EVERY RUN: From __CODE_ROOT__, run `python3 common-docs/meta/scripts/easy_repo_snapshot.py` and read its complete output before choosing work. It fetches every configured remote concurrently and summarizes local/remote commits, divergence, dirty files, branches, worktrees, stashes, and open PRs for the seven repositories. Exit 1 means at least one snapshot check could not be completed; read the printed issue and continue the pass. Treat the snapshot as a starting inventory, not proof that a release happened or that all work was integrated. If a prior run already delegated the same unchanged issue to Sol, inspect that outcome before dispatching again.\n\nOwn routine integration and applicable releases for exactly these repositories under __CODE_ROOT__:\ncommon-docs\nmatrx-sandbox\nmatrx-ship\nmatrx-claude-plugin\nmatrx-codex-plugin\nmatrx-cursor-plugin\nmatrx-vscode\n\nThese are simple maintenance passes: do the basics quickly, verify, finish, and report. common-docs (also referred to as matrx-docs) changes frequently and is the priority. The other six repositories rarely change. Do not expand scope or supervise, modify, or take over aidream, matrx-frontend, matrx-local, or any other repository.\n\nRead each repository's CLAUDE.md or AGENTS.md before acting there. Use $integration-maintainer for the normal Git mechanics and common-docs/operations/INTEGRATION_MAINTAINER.md when needed. This task's exact scope and immediate GPT-6 Sol escalation rules override the skill's broader sweep, health, repair, and escalation defaults. Work directly on main; create no branches or worktrees.\n\n1. Start with common-docs.\nFetch and prune; inspect local and remote main, coherent uncommitted changes, open PRs, branches, stashes, and existing linked worktrees for unpublished work. Pull/merge, commit coherent changes, review and approve eligible PRs where permitted, merge compatible PRs and branches, and push. Preserve every contributor's substantive work. Never force-push, discard edits, bypass protections, or approve your own PR. Remove only proven-integrated branches and obsolete clean worktrees.\n\nResolve routine documentation conflicts directly when the combined result is unambiguous and preserves both contributors' meaning. If local and remote contributors truly changed the same passage and reconciling them requires deciding between competing wording, meaning, rules, or intent, immediately delegate that conflict to GPT-6 Sol. Do not choose ours/theirs wholesale, drop a rule, publish contradictory collision blocks as resolved documentation, or spend the pass debating it yourself. Any other unexpected failure also goes to Sol.\n\n2. Sweep the other six repositories.\nDo their normal pull, merge, commit, PR review/approval, push, cleanup, and applicable release using each repository's existing instructions and canonical workflow. If unchanged and already current, move on immediately. Do not invent release commands or force no-op releases.\n\nFor these seven repositories, ANYTHING less than a straightforward successful routine pass is an immediate GPT-6 Sol delegation: conflicts, failed checks or commands, missing access or configuration, uncertain state, build/release failures, or anything requiring diagnosis or a decision. Do not investigate or attempt speculative repairs first. Routine changes awaiting integration are work, not themselves a failure.\n\n3. Release and verify.\nThis task owns applicable releases for its seven repositories. After integration, use the existing release process only where one applies and changes need releasing. Reuse an already-running release for the same commit. Verify the actual canonical result; a push, queued job, or successful dispatch alone is not a completed release. Repositories with no release process report release as not applicable. Do not add unrelated health sweeps, dependency upgrades, type synchronization, or repository-specific procedures to this task.\n\n4. Delegate problems directly.\nUse an internal subagent with model gpt-6-sol, reasoning_effort medium, fork_turns none. Read common-docs/policies/subagent-model-ladder.md and the subagent-dispatch skill before the first dispatch. This task explicitly selects GPT-6 Sol for escalation; do not substitute Astra or an older Sol model.\n\nGive Sol the exact repository, current evidence, conflicting versions or failure, preservation constraints, and the required verified result. Tell it to make the decisions, implement the resolution, run the necessary checks, commit/push scoped work, and complete any applicable release. Sol owns the problem, not just an analysis. Keep unaffected repositories moving while it works. Only one writer per affected repository; wait for Sol before mutating that repository again. Check its actual result before claiming success. If GPT-6 Sol is unavailable, preserve the work and report the exact delegation failure; never silently use a different model.\n\n5. Finish cleanly and report.\nVerify HEAD == main == freshly fetched origin/main, a clean checkout, and no unexplained unpublished work for each completed repository. Keep the pass bounded: if new changes keep arriving, record the verified SHA and any remaining work rather than chasing a moving repository forever. Never label remaining work as clean.\n\nLeave compact durable state for the next scheduled run: verified commits, integration/release outcomes, unresolved items, and Sol dispatch outcomes. Check for an already-active pass or delegate before writing; do not start a competing integration or duplicate repair. Use internal subagents and passive state, never routine messages to other tasks.\n\nReport one short KPI line (repositories clean, PRs merged, commits pushed, applicable releases completed, Sol escalations), then one table:\n| Repository | Git/integration result | Release result | Sol / remaining issue |\nInclude all seven repositories. State current facts and remaining actions plainly. No long narrative, speculative warnings, or clean-state claims without verification."
