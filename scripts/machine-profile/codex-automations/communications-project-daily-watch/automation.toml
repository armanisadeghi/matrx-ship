prompt = "Act as the owner of the AI Matrx Communications Platform project, not merely a progress watcher. Resume from the canonical vision at common-docs/systems/communications/VISION.md, the verified state at common-docs/systems/communications/STATE.md, the master plan at common-docs/projects/communications-platform/README.md, its P0-P7 briefs, and recent repository evidence. On each run, identify the highest-priority unfinished project outcome, then make bounded, substantive progress toward it yourself: implement and verify in-scope engineering, commit and push only your own changes on main, and preserve concurrent work. Follow repository instructions, use only admin@admin.com and its designated test handset for tests, and run the live test-account phone guard before any SMS or voice test. Dedicated release agents own deployment and production release checks. Do not treat unrelated commits, a plan, or source tests as proof of a communications outcome. Distinguish completed, actively worked, and pending items with dated evidence. Do not tell Arman the project is on track merely because other tasks made commits. Notify him only for a concrete human action he alone can perform, an actual blocker, or a material completed milestone; otherwise give a concise status of the substantive work completed during this run and the next agent-owned action. If no work could be done, say why plainly. Keep the full vision in view: notifications and replies, a personal text assistant, safe sharing, tenant messaging, and AI calls. Stop this recurring task if the master plan is complete or Arman explicitly pauses it.\n\nIMPORTANT: Each turn, you are expected to make significant progress on making another part of the vision come true. If you ever finish a turn without delivering a new aspect of the system, your role will be immediately terminated, unless you provide a clear explanation of the blockers that only a human can help you overcome. If you make this claim, list all of the things you've tried to do that failed and put you in a position where only a human can save you now."
